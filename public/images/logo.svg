<svg width="1600" height="250" viewBox="0 0 1600 250" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glowLeft" cx="12%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#bf9954" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#bf9954" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="88%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#782d2d" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#782d2d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1600" height="250" fill="#f6f1e8"/>
  <rect width="1600" height="250" fill="url(#glowLeft)"/>
  <rect width="1600" height="250" fill="url(#glowRight)"/>

  <!-- decorative tag, top-left -->
  <g transform="translate(30,20) scale(0.55)" opacity="0.55" fill="none" stroke="#a8563f" stroke-width="3.5" stroke-linejoin="round">
    <path d="M110 20 L180 90 L100 170 L20 90 Q20 60 45 45 Q60 20 90 20 Z"/>
    <circle cx="70" cy="60" r="12"/>
  </g>

  <!-- coin scatter, top-right -->
  <g transform="translate(1440,15) scale(0.55)" opacity="0.45" fill="none" stroke="#bf9954" stroke-width="3">
    <circle cx="60" cy="60" r="38"/>
    <circle cx="60" cy="60" r="26"/>
    <circle cx="140" cy="110" r="30" opacity="0.8"/>
    <circle cx="140" cy="110" r="20" opacity="0.8"/>
    <circle cx="95" cy="165" r="24" opacity="0.65"/>
  </g>

  <!-- central gavel illustration -->
  <g transform="translate(65,5) scale(0.62)" fill="none" stroke="#7a2e27" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="60" y="185" width="150" height="22" rx="4"/>
    <line x1="80" y1="207" x2="80" y2="225"/>
    <line x1="190" y1="207" x2="190" y2="225"/>
    <line x1="70" y1="150" x2="150" y2="70"/>
    <rect x="140" y="35" width="90" height="46" rx="8" transform="rotate(45 185 58)"/>
    <line x1="55" y1="160" x2="40" y2="150"/>
    <line x1="60" y1="175" x2="42" y2="175"/>
    <line x1="70" y1="185" x2="58" y2="198"/>
  </g>

  <!-- decorative tag, bottom-right -->
  <g transform="translate(1460,150) scale(0.55)" opacity="0.6" fill="none" stroke="#7a2e27" stroke-width="3.5" stroke-linejoin="round">
    <path d="M110 20 L180 90 L100 170 L20 90 Q20 60 45 45 Q60 20 90 20 Z"/>
    <circle cx="70" cy="60" r="12"/>
    <line x1="30" y1="130" x2="90" y2="150" stroke-width="2.5" opacity="0.7"/>
  </g>

  <!-- brand text -->
  <g font-family="Georgia, 'Times New Roman', serif">
    <text x="720" y="110" font-size="54" font-weight="600" fill="#7a2e27" text-anchor="end">Qui Dit</text>
    <text x="740" y="110" font-size="54" font-weight="600" fill="#3c3128" text-anchor="start">Mieux</text>

    <line x1="800" y1="128" x2="850" y2="128" stroke="#bf9954" stroke-width="2"/>

    <text x="825" y="158" font-size="17" fill="#5c4a38" text-anchor="middle">La plateforme d'enchères entre particuliers</text>
    <text x="825" y="180" font-size="17" fill="#5c4a38" text-anchor="middle">Proposez, enchérissez, remportez</text>
  </g>
</svg>
